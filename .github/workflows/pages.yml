name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/quality/**'
      - 'docs/diagrams/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the quality page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true creates the Pages site on the first run, so the
      # quality page stays reachable without touching repository settings.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # The interactive diagrams live in docs/diagrams; copy them into the
      # artifact root so they publish next to the quality page.
      - name: Include diagrams
        run: |
          mkdir -p docs/quality/diagrams
          cp docs/diagrams/*.html docs/quality/diagrams/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/quality

      - id: deployment
        uses: actions/deploy-pages@v5
