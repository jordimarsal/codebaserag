name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      # Sync into a project venv instead of `uv pip install --system`: the
      # runner's system Python is externally managed (PEP 668) and would fail.
      # `--locked` also keeps CI on exactly the versions recorded in uv.lock.
      - name: Install dev deps
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy (strict)
        run: uv run mypy --check-untyped-defs --strict .
      - name: Tests
        run: uv run pytest -q tests
