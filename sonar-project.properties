# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
# CLI -D flags override these, so this file is the single place to tune the scan.
#
# Run `uv run pytest -q tests` first: it leaves coverage.xml at the repo root
# ([tool.pytest.ini_options] addopts).
sonar.projectKey=jordimarsal:codebaserag
sonar.sourceEncoding=UTF-8

# Lock files and env templates are generated/config, not maintained code.
# This list replaces the scanner's default exclusions entirely, so the
# standard build-output patterns are kept here too.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,coverage.xml,**/.env*,**/uv.lock,**/requirements.lock

# Explicitly include everything: the scanner CLI leaves sources empty when
# only sonar.tests is set (same gotcha as any single-module Java project).
sonar.sources=.
sonar.test.inclusions=**/tests/**

# Tests: pytest sources, excluded from the coverage denominator.
sonar.tests=tests

# Coverage: coverage.py XML written by the default pytest run.
sonar.python.coverage.reportPaths=coverage.xml
