[project]
name = "codebaserag"
version = "0.1.0"
description = "Hexagonal RAG over your own codebase with deterministic eval-first core."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pathspec>=0.12",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.scripts]
coderag = "coderag.cli:app"

[project.optional-dependencies]
pgvector = ["sqlalchemy>=2.0", "pgvector>=0.2", "psycopg[binary]>=3.1"]
qdrant = ["qdrant-client>=1.9"]
embeddings = ["ollama>=0.2"]
llm = ["litellm>=1.40"]
rerank = ["sentence-transformers>=3.0"]
bm25 = ["tantivy>=0.21"]
observability = ["langfuse>=2.0"]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `evals` ships as a top-level package: the CLI's eval command and the
# memory-backend HashEmbedder (via coderag.compose) import from it.
packages = ["src/coderag", "evals"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = ["harness", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_reexport = true
namespace_packages = true
files = ["src"]
exclude = ["tests/", "evals/", "harness/"]

[[tool.mypy.overrides]]
module = ["ollama", "pgvector", "pathspec", "requests", "yaml", "tantivy", "sentence_transformers", "litellm", "langfuse", "qdrant_client"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as eval (deselect with '-m \"not eval\"')",
]
